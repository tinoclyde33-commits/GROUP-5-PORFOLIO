    <div class="container">
        <h1 class="title">Welcome to Our Portfolio</h1>
        <p class="developers">
            <span class="typewriter-text"></span><span class="cursor"></span>
        </p>
    </div>
    <div>
        <h1 class="ABOUT1">ABOUT OUR GROUP</h1>
        <p class="TEXTABOUT">We are a group of passionate developers dedicated to creating innovative solutions and delivering exceptional user experiences.</p>
    </div>




    <script>
        const words = ["Mababa, Mark Jovin", "Rosquita, Fibelen", "Moselina, Roxie", "Tino, Clyde Drexler", "Sebastian, Ralph John", "Campos, Rhian"];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typewriterElement = document.querySelector(".typewriter-text");
        const typingSpeed = 100;
        const deletingSpeed = 50;
        const pauseBetweenWords = 1000;

        function typeWriter() {
            const currentWord = words[wordIndex];

            if (isDeleting) {
                // Deleting phase
                typewriterElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;

                if (charIndex === 0) {
                    isDeleting = false;
                    wordIndex = (wordIndex + 1) % words.length;
                    setTimeout(typeWriter, pauseBetweenWords);
                } else {
                    setTimeout(typeWriter, deletingSpeed);
                }
            } else {
                // Typing phase
                typewriterElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;

                if (charIndex === currentWord.length) {
                    isDeleting = true;
                    setTimeout(typeWriter, pauseBetweenWords);
                } else {
                    setTimeout(typeWriter, typingSpeed);
                }
            }
        }

        // Start the typewriter effect
        typeWriter();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
